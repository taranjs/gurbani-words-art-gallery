<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gurbani Words Art Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-navy">
    <main class="gallery-app">
      <header class="gallery-header">
        <p class="eyebrow">ੴ</p>
        <h1>Gurbani Word Meanings Gallery</h1>
        <h2>Fall in Love with Gurbani, One Word at a time!</h2>
      </header>

      <section class="experience" aria-label="Virtual art gallery">
        <div class="aura"></div>
        <div class="light-beams"></div>

        <div class="utility-controls" aria-label="Experience controls">
          <button id="fullscreenBtn" class="utility-btn utility-btn--icon" aria-pressed="false" aria-label="Enter fullscreen" title="Toggle fullscreen">⛶</button>
          <button id="settingsBtn" class="utility-btn utility-btn--icon" aria-expanded="false" aria-haspopup="true" aria-controls="settingsPanel" aria-label="Open settings" title="Settings">⚙</button>

          <div id="settingsPanel" class="settings-panel" role="group" aria-label="Gallery settings" hidden>
            <button id="soundBtn" class="utility-btn utility-btn--menu" aria-pressed="false" aria-label="Toggle ambient sound">Sound: Off</button>
            <label class="utility-select-wrap" for="soundPreset">Tone</label>
            <select id="soundPreset" class="utility-select" aria-label="Choose ambient sound profile">
              <option value="mool">Mool Drone</option>
              <option value="tanpura">Tanpura Glow</option>
              <option value="river">River Shabad</option>
            </select>
            <label class="utility-select-wrap" for="themePreset">Theme</label>
            <select id="themePreset" class="utility-select" aria-label="Choose gallery theme">
              <option value="navy">Satin Navy</option>
              <option value="ochre">Ochre</option>
              <option value="crimson">Crimson Darbar</option>
            </select>
          </div>
        </div>

        <div class="gallery-wall" id="galleryWall" role="list" aria-label="Gurbani word artwork gallery"></div>

        <div class="floor"></div>

        <div class="nav-controls" aria-label="Gallery navigation controls">
          <button id="prevBtn" class="nav-btn" aria-label="Move left">← Left</button>
          <button id="centerBtn" class="nav-btn nav-btn--soft" aria-label="Center current artwork">Center</button>
          <button id="nextBtn" class="nav-btn" aria-label="Move right">Right →</button>
        </div>
        <p class="guide-text">Walk slowly, reflect deeply, and discover each word as living light.</p>
        <p class="help-text">Use buttons, arrow keys, mouse wheel, or drag to walk. Press M for sound and F for fullscreen. Chimes play while sound is on.</p>
      </section>
    </main>

    <template id="artCardTemplate">
      <article class="art-card" role="listitem">
        <div class="frame">
          <img loading="lazy" alt="Gurbani word artwork" />
        </div>
        <p class="reflection"></p>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
